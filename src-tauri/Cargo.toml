[package]
name = "simple-office-suite"
version = "1.0.0"
description = "Lightweight, offline-first, cross-platform productivity suite"
authors = ["Simple Office Suite Contributors"]
license = "MIT"
repository = "https://github.com/simple-office/simple-office-suite"
edition = "2021"

[lib]
name = "simple_office_suite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-dialog = "2.0.0"
tauri-plugin-fs = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
dirs = "5.0"
sysinfo = "0.31"
