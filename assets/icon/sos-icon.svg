<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="55%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#3730a3"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="228" ry="228" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="228" ry="228" fill="url(#sheen)"/>

  <!-- three workspace panels: writer, sheets, slides -->
  <g fill="#ffffff" fill-opacity="0.13">
    <rect x="150" y="176" width="724" height="672" rx="52" ry="52"/>
  </g>
  <g stroke="#ffffff" stroke-opacity="0.5" stroke-width="13" fill="none" stroke-linecap="round">
    <path d="M224 316 H470"/>
    <path d="M224 380 H560"/>
    <path d="M224 444 H420"/>
  </g>
  <g fill="#ffffff" fill-opacity="0.30">
    <rect x="596" y="292" width="222" height="14" rx="7"/>
    <rect x="596" y="352" width="222" height="14" rx="7"/>
    <rect x="596" y="412" width="222" height="14" rx="7"/>
  </g>

  <!-- wordmark -->
  <text x="512" y="742" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="248" font-weight="700" letter-spacing="10" fill="#ffffff"
        text-anchor="middle">SOS</text>
</svg>
