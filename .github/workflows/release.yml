name: Release Simple Office Suite

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # Apple Silicon & Intel Universal binary
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-22.04' # Linux AppImage & DEB
            args: ''
          - platform: 'windows-latest' # Windows MSI & NSIS
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux System Dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Frontend Dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Build Tauri Application & Release Assets
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Simple Office Suite ${{ github.ref_name }}'
          releaseBody: |
            ### Simple Office Suite (SOS) ${{ github.ref_name }}
            
            Lightweight, offline-first productivity suite built with Tauri 2.0 and Rust.
            
            #### Assets Included:
            - **macOS**: Universal `.dmg` (Apple Silicon & Intel)
            - **Linux**: Standalone `.AppImage` and `.deb` package
            - **Windows**: Modern `.msi` and `.exe` (NSIS) installers
            
            *Zero Cloud Dependencies • 100% Offline • Memory Footprint < 150MB*
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
