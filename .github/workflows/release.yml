name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed release tag
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  checks:
    name: Release checks
    runs-on: ubuntu-22.04
    steps:
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          case "$RELEASE_TAG" in
            v[0-9]*) ;;
            *) echo "Release tag must start with v followed by a digit" >&2; exit 1 ;;
          esac
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install npm dependencies
        run: npm ci
      - name: Check frontend
        run: npm run check
      - name: Test frontend
        run: npm test
      - name: Build frontend
        run: npm run build
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Require Cargo lockfile
        shell: bash
        run: test -f src-tauri/Cargo.lock
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Check Rust
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked
      - name: Test Rust
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Run Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets --all-features -- -D warnings

  build:
    name: Build ${{ matrix.name }}
    needs: checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-15
            target: aarch64-apple-darwin
            target_dir: src-tauri/target/aarch64-apple-darwin/release/bundle
            bundles: app,dmg
            expected: .app,.dmg
            python: python3
          - name: macOS x64
            os: macos-15-intel
            target: x86_64-apple-darwin
            target_dir: src-tauri/target/x86_64-apple-darwin/release/bundle
            bundles: app,dmg
            expected: .app,.dmg
            python: python3
          - name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            target_dir: src-tauri/target/x86_64-unknown-linux-gnu/release/bundle
            bundles: deb,appimage
            expected: .deb,.AppImage
            python: python3
          - name: Windows x64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            target_dir: src-tauri/target/x86_64-pc-windows-msvc/release/bundle
            bundles: nsis,msi
            expected: .msi,.exe
            python: python
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install npm dependencies
        run: npm ci
      - name: Install Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Require Cargo lockfile
        shell: bash
        run: test -f src-tauri/Cargo.lock
      - name: Build Tauri bundles
        run: npm run tauri -- build --target "${{ matrix.target }}" --bundles "${{ matrix.bundles }}" --ci
      - name: Verify Tauri bundles
        run: ${{ matrix.python }} scripts/package_all.py --bundle-dir "${{ matrix.target_dir }}" --expect "${{ matrix.expected }}"
      - name: Upload Tauri bundles
        uses: actions/upload-artifact@v4
        with:
          name: tauri-${{ matrix.name }}
          path: ${{ matrix.target_dir }}
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish verified Tauri artifacts
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - name: Download Tauri bundles
        uses: actions/download-artifact@v4
        with:
          pattern: tauri-*
          path: release-assets
          merge-multiple: true
      - name: Verify downloaded bundles
        run: python3 scripts/package_all.py --bundle-dir release-assets
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Simple Office Suite ${{ env.RELEASE_TAG }}
          files: |
            release-assets/**/*.dmg
            release-assets/**/*.msi
            release-assets/**/*.exe
            release-assets/**/*.deb
            release-assets/**/*.AppImage
          fail_on_unmatched_files: true
          generate_release_notes: true
