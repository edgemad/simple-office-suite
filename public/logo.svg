<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Glass Reflection -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="25%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Card Shadows -->
    <filter id="cardShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <filter id="frontCardShadow" x="-15%" y="-15%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#020617" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Base macOS Squircle Container -->
  <rect x="36" y="36" width="440" height="440" rx="98" fill="url(#bgGrad)" />
  <rect x="36" y="36" width="440" height="440" rx="98" fill="url(#glassGrad)" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.25" />

  <!-- Layer 1: Slides Card (Orange / Presentation Theme) -->
  <g filter="url(#cardShadow)">
    <rect x="250" y="115" width="165" height="150" rx="14" fill="#ea580c" />
    <!-- Mini Slide Canvas -->
    <rect x="264" y="130" width="137" height="120" rx="8" fill="#c2410c" />
    <!-- Bar Chart Elements -->
    <rect x="282" y="195" width="16" height="40" rx="3" fill="#fed7aa" />
    <rect x="306" y="170" width="16" height="65" rx="3" fill="#ffedd5" />
    <rect x="330" y="150" width="16" height="85" rx="3" fill="#ffffff" />
    <circle cx="370" cy="155" r="9" fill="#fed7aa" />
  </g>

  <!-- Layer 2: Sheets Card (Emerald / Spreadsheet Theme) -->
  <g filter="url(#cardShadow)">
    <rect x="180" y="180" width="190" height="175" rx="14" fill="#059669" />
    <!-- Mini Grid Canvas -->
    <rect x="194" y="194" width="162" height="147" rx="8" fill="#047857" />
    <!-- Grid Cells -->
    <rect x="206" y="206" width="44" height="20" rx="3" fill="#a7f3d0" />
    <rect x="255" y="206" width="44" height="20" rx="3" fill="#34d399" />
    <rect x="304" y="206" width="40" height="20" rx="3" fill="#34d399" />

    <rect x="206" y="232" width="44" height="20" rx="3" fill="#10b981" />
    <rect x="255" y="232" width="44" height="20" rx="3" fill="#10b981" />
    <rect x="304" y="232" width="40" height="20" rx="3" fill="#10b981" />

    <rect x="206" y="258" width="44" height="20" rx="3" fill="#10b981" />
    <rect x="255" y="258" width="44" height="20" rx="3" fill="#10b981" />
    <rect x="304" y="258" width="40" height="20" rx="3" fill="#10b981" />

    <rect x="206" y="284" width="44" height="22" rx="3" fill="#065f46" />
    <rect x="255" y="284" width="89" height="22" rx="3" fill="#6ee7b7" />
  </g>

  <!-- Layer 3: Writer Card (Front White Paginated Document with Drop Shadow) -->
  <g filter="url(#frontCardShadow)">
    <!-- Main White Document Page -->
    <rect x="95" y="150" width="185" height="250" rx="16" fill="#ffffff" />
    <!-- Subtle Document Inner Margin Line -->
    <rect x="110" y="165" width="155" height="220" rx="8" fill="#f8fafc" />

    <!-- Document Header Banner -->
    <rect x="122" y="180" width="131" height="26" rx="6" fill="#2563eb" />

    <!-- Stylized Document Text Rows -->
    <rect x="122" y="222" width="131" height="9" rx="4.5" fill="#64748b" />
    <rect x="122" y="239" width="115" height="9" rx="4.5" fill="#94a3b8" />
    <rect x="122" y="256" width="125" height="9" rx="4.5" fill="#94a3b8" />
    <rect x="122" y="273" width="90" height="9" rx="4.5" fill="#cbd5e1" />

    <!-- Feature Callout Quote / Table Bar -->
    <rect x="122" y="296" width="4" height="32" rx="2" fill="#3b82f6" />
    <rect x="132" y="299" width="110" height="8" rx="4" fill="#94a3b8" />
    <rect x="132" y="315" width="95" height="8" rx="4" fill="#cbd5e1" />

    <!-- SOS Monogram Stamp -->
    <rect x="122" y="344" width="42" height="24" rx="6" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" />
    <text x="143" y="360" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="11" fill="#1d4ed8" text-anchor="middle">SOS</text>
  </g>

  <!-- Subtle Ambient Glow -->
  <circle cx="256" cy="460" r="90" fill="#38bdf8" opacity="0.15" filter="blur(25px)" />
</svg>
