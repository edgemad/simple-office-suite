<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Simple Office Suite (SOS) - Lightweight, offline-first productivity suite" />
    <title>Simple Office Suite</title>
    <script>
      window.addEventListener('error', function(e) {
        console.error('Critical window error:', e);
        var banner = document.getElementById('startup-error-banner');
        if (!banner) {
          banner = document.createElement('div');
          banner.id = 'startup-error-banner';
          banner.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:#1e293b;color:#f87171;padding:32px;font-family:ui-monospace,SFMono-Regular,monospace;font-size:13px;z-index:9999999;overflow:auto;display:flex;flex-direction:column;gap:12px;';
          banner.innerHTML = '<h2 style="color:#ef4444;font-size:18px;margin:0 0 8px 0;font-family:sans-serif;">Application Startup Error</h2>' +
            '<p style="color:#cbd5e1;margin:0;">An unexpected error prevented the application interface from loading:</p>' +
            '<pre id="error-details" style="background:#0f172a;padding:16px;border-radius:8px;border:1px solid #334155;overflow:auto;color:#fca5a5;white-space:pre-wrap;"></pre>' +
            '<div style="display:flex;gap:12px;margin-top:16px;">' +
            '<button onclick="localStorage.clear();location.reload();" style="background:#ef4444;color:white;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;font-weight:600;">Reset Cache & Reload</button>' +
            '<button onclick="location.reload();" style="background:#334155;color:white;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;">Reload Application</button>' +
            '</div>';
          document.body ? document.body.appendChild(banner) : document.documentElement.appendChild(banner);
        }
        var pre = document.getElementById('error-details');
        if (pre) {
          pre.textContent += (e.message || e) + '\nLocation: ' + (e.filename || '') + ':' + (e.lineno || '') + ':' + (e.colno || '') + '\n' + (e.error && e.error.stack ? e.error.stack : '') + '\n\n';
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        console.error('Unhandled rejection:', e);
      });
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 select-none overflow-hidden h-screen w-screen">
    <div id="app" class="h-full w-full"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
